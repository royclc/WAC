apiVersion: apps/v1
kind: Deployment
metadata:
  name: mac-web
  namespace: mac-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mac-web
  template:
    metadata:
      labels:
        app: mac-web
    spec:
      containers:
        - name: mac-web
          image: mac-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_SUPABASE_URL
              value: "http://postgrest:3001"
            - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
              value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.RFGTHZVWY7bcm2eW_z7Fi6EqtQ0Ttpt5lPibS_FuYfg"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mac-web
  namespace: mac-system
spec:
  type: NodePort
  selector:
    app: mac-web
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
