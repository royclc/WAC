apiVersion: v1
kind: Secret
metadata:
  name: mac-secrets
  namespace: mac-system
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_PASSWORD: "postgres"
  # PostgREST authenticator 角色密碼（需與 local-postgres-setup.sql 一致）
  PGRST_AUTHENTICATOR_PASSWORD: "mysecretpassword"
  # JWT secret（至少 32 字元，需與 .env.local 的 token 簽名用同一把）
  PGRST_JWT_SECRET: "super-secret-jwt-token-for-local-dev-only-32chars!!"
