version: "3.8"

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: mac-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mac_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./local-postgres-setup.sql:/docker-entrypoint-initdb.d/01-setup.sql
      - ./local-postgres-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PostgREST (REST API) ──
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: mac-postgrest
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:mysecretpassword@postgres:5432/mac_system
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-for-local-dev-only-32chars!!
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
